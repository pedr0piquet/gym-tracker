<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Gym Tracker</title>
  <!--
    Página publicada no GitHub Pages (também como 404.html, para qualquer caminho).
    O app de verdade roda no servidor do PC, exposto pelo Tailscale Funnel.
    Se o servidor responder, redireciona para o mesmo caminho lá; senão, avisa.
    APP_URL é preenchido pelo ./tunnel.sh.
  -->
  <style>
    :root {
      --bg: #f4f5f7; --surface: #ffffff; --border: #e2e4e9; --text: #15171c; --muted: #6b7180;
      --accent: #e8590c;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1115; --surface: #181b21; --border: #262a33; --text: #eef0f4; --muted: #8b92a1;
        --accent: #ff7a33;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1115; --surface: #181b21; --border: #262a33; --text: #eef0f4; --muted: #8b92a1;
      --accent: #ff7a33;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .box {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      text-align: center;
    }
    .logo {
      display: inline-grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
    }
    h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.01em; }
    p { margin: 0; color: var(--muted); }
    button {
      min-height: 44px;
      margin-top: 20px;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main class="box">
    <span class="logo" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>
      </svg>
    </span>
    <h1 id="title">Gym Tracker</h1>
    <p id="message" role="status">Conectando ao servidor…</p>
    <button type="button" id="retry" hidden>Tentar de novo</button>
  </main>

  <script>
    const APP_URL = ''; // ex.: 'https://meu-pc.tail1234.ts.net' (preenchido pelo ./tunnel.sh)
    const BASE = '/gym-tracker'; // caminho do projeto no GitHub Pages

    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const retry = document.getElementById('retry');

    function fail(text) {
      title.textContent = 'Servidor indisponível';
      message.textContent = text;
      retry.hidden = false;
    }

    async function connect() {
      retry.hidden = true;
      title.textContent = 'Gym Tracker';
      message.textContent = 'Conectando ao servidor…';

      if (!APP_URL) {
        fail('O endereço do servidor ainda não foi configurado.');
        return;
      }
      try {
        const res = await fetch(`${APP_URL}/api/health`, { cache: 'no-store', signal: AbortSignal.timeout(8000) });
        if (!res.ok) throw new Error(res.status);
      } catch {
        fail('Não foi possível conectar ao servidor no momento. Tente de novo mais tarde.');
        return;
      }
      // Mesmo caminho no servidor: /gym-tracker/historico.html?ex=x → APP_URL/historico.html?ex=x
      const path = location.pathname.startsWith(BASE) ? location.pathname.slice(BASE.length) : location.pathname;
      location.replace(APP_URL + (path || '/') + location.search + location.hash);
    }

    retry.addEventListener('click', connect);
    connect();
  </script>
</body>
</html>
