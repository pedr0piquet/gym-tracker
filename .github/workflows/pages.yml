name: Deploy GitHub Pages

# O Pages publica só a página de entrada (pages/), que redireciona para o servidor
# do PC (Tailscale Funnel) ou avisa que ele está fora do ar. O app fica em public/
# e é servido pelo Express.

on:
  push:
    branches: [main]
    paths: [pages/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 404.html = mesma página, para qualquer caminho (ex.: /gym-tracker/historico.html) redirecionar
      - run: cp pages/index.html pages/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
