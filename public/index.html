<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Painel · Gym Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="catalog.js" defer></script>
  <script src="common.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <a class="logo" href="index.html" aria-label="Gym Tracker – Painel">
        <span class="logo-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>
          </svg>
        </span>
        <span class="logo-text">Gym Tracker</span>
      </a>
      <nav class="tabs" aria-label="Principal">
        <a href="index.html" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>
          <span>Painel</span>
        </a>
        <a href="treinos.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg>
          <span>Treino</span>
        </a>
        <a href="exercicios.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>
          <span>Exercícios</span>
        </a>
        <a href="historico.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"/><path d="m5 15 4-5 4 3 6-7"/></svg>
          <span>Histórico</span>
        </a>
      </nav>
      <button type="button" class="icon-btn" id="search-toggle" aria-label="Buscar" aria-expanded="false" aria-controls="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
      </button>
    </div>
    <div class="search-bar" id="search-bar" hidden>
      <input type="search" id="search-input" placeholder="Buscar por nome ou músculo…" aria-label="Buscar por nome ou músculo" autocomplete="off">
    </div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>Treino de hoje</h1>
        <p class="subtitle"><span id="greeting"></span>Toque em um exercício para ver as séries.</p>
      </div>
      <div class="toggles">
        <div class="segmented unit-toggle" role="group" aria-label="Unidade de carga">
          <button type="button" data-unit="kg">kg</button>
          <button type="button" data-unit="lb">lb</button>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Alternar modo escuro">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </div>


    <div class="today-bar">
      <label class="preset-select">
        <span>Treino</span>
        <select id="preset-select"></select>
      </label>
      <a class="link-small" href="treinos.html">Editar treinos</a>
    </div>

    <div class="list" id="exercises"></div>
    <p class="empty" id="empty" hidden></p>
    <button type="button" class="btn btn-secondary btn-block" id="add-exercise">+ Adicionar exercício</button>
  </main>

  <dialog class="sheet" id="add-dialog" aria-labelledby="add-title">
    <div class="sheet-head">
      <h2 id="add-title">Adicionar ao treino de hoje</h2>
      <button type="button" class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="add-picker"></div>
  </dialog>

  <template id="card-template">
    <details class="card">
      <summary>
        <span class="thumb">
          <svg class="thumb-fallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>
          </svg>
          <img class="frame frame-start" alt="" loading="lazy">
          <img class="frame frame-end" alt="" loading="lazy">
        </span>
        <span class="info">
          <strong class="name"></strong>
          <span class="muscles"></span>
          <span class="summary-line">
            <span class="chip sets"></span>
            <span class="chip load"></span>
            <span class="chip rest"></span>
          </span>
        </span>
        <span class="card-actions">
          <button type="button" class="fav-btn" aria-pressed="false">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/>
            </svg>
          </button>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </span>
      </summary>
      <div class="details">
        <ol class="set-list"></ol>

        <form class="add-set" hidden>
          <label>
            <span>Carga (<span class="unit-label">kg</span>)</span>
            <input name="weight" type="number" inputmode="decimal" step="0.5" min="0" required>
          </label>
          <label>
            Vezes
            <input name="count" type="number" inputmode="numeric" min="1" max="20" required>
          </label>
          <label>
            Reps
            <input name="reps" type="number" inputmode="numeric" min="1" required>
          </label>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
        <button type="button" class="btn btn-primary add-set-toggle">+ Adicionar</button>

        <div class="last-row">
          <p class="last-time">Última vez<span class="last-date"></span>: <span class="last-sets"></span></p>
          <button type="button" class="btn btn-progress" hidden></button>
        </div>
        <div class="card-links">
          <a class="history-link">Ver histórico →</a>
          <button type="button" class="link-button remove-today" hidden>Tirar de hoje</button>
        </div>
      </div>
    </details>
  </template>

  <template id="set-template">
    <li class="set">
      <span class="set-number"></span>
      <span class="set-weight"></span>
      <span class="set-reps"></span>
    </li>
  </template>
</body>
</html>
