<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Histórico · Gym Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="mock_user.js" defer></script>
  <script src="common.js" defer></script>
  <script src="historico.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <a class="logo" href="index.html" aria-label="Gym Tracker">
        <span class="logo-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>
          </svg>
        </span>
      </a>
      <nav aria-label="Principal">
        <a href="#" aria-disabled="true" title="Em breve">Painel</a>
        <a href="index.html">Treino</a>
        <a href="historico.html" aria-current="page">Histórico</a>
      </nav>
      <button type="button" class="icon-btn" id="search-toggle" aria-label="Buscar exercício" aria-expanded="false" aria-controls="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
      </button>
    </div>
    <div class="search-bar" id="search-bar" hidden>
      <input type="search" id="search-input" placeholder="Buscar exercício…" aria-label="Buscar exercício" autocomplete="off">
    </div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>Histórico</h1>
        <p class="subtitle"><span id="greeting"></span>Evolução de cada exercício.</p>
      </div>
      <div class="toggles">
        <div class="segmented unit-toggle" role="group" aria-label="Unidade de carga">
          <button type="button" data-unit="kg">kg</button>
          <button type="button" data-unit="lb">lb</button>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Alternar modo escuro">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Escolha do exercício (favoritos primeiro) -->
    <div class="picker" id="picker" role="group" aria-label="Exercício"></div>
    <p class="empty" id="empty" hidden>Nenhum exercício encontrado.</p>

    <section class="panel" id="detail" aria-labelledby="ex-name">
      <div class="detail-head">
        <h2 id="ex-name"></h2>
      </div>

      <div class="stat-row">
        <div class="stat-tile">
          <span class="stat-label">Maior carga</span>
          <span class="stat-value" id="stat-load"></span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">Melhor 1RM est.</span>
          <span class="stat-value" id="stat-1rm"></span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">Treinos</span>
          <span class="stat-value" id="stat-count"></span>
        </div>
      </div>

      <div class="chart-head">
        <span class="chart-title" id="chart-title"></span>
        <div class="segmented" id="metric-toggle" role="group" aria-label="Métrica do gráfico">
          <button type="button" data-metric="e1rm">1RM est.</button>
          <button type="button" data-metric="maxLoad">Carga</button>
          <button type="button" data-metric="volume">Volume</button>
        </div>
      </div>

      <figure class="chart" id="chart">
        <svg id="chart-svg" role="img"></svg>
        <div class="chart-tooltip" id="chart-tooltip" hidden></div>
      </figure>
      <p class="chart-note" id="chart-note"></p>

      <h3>Treinos</h3>
      <div class="table-wrap">
        <table class="sessions">
          <thead>
            <tr>
              <th scope="col">Data</th>
              <th scope="col">Registros</th>
              <th scope="col" class="num">Carga máx.</th>
              <th scope="col" class="num">Volume</th>
            </tr>
          </thead>
          <tbody id="sessions-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
