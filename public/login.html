<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Entrar · Gym Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="login.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <span class="logo" aria-label="Gym Tracker">
        <span class="logo-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>
          </svg>
        </span>
        <span class="logo-text">Gym Tracker</span>
      </span>
      <button type="button" class="icon-btn auth-theme" id="theme-toggle" aria-label="Alternar modo escuro">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="auth">
    <h1 id="auth-title">Entrar</h1>
    <p class="subtitle">Seu diário de cargas: registre cada série e acompanhe a evolução.</p>

    <div class="panel">
      <div class="segmented auth-mode" role="group" aria-label="Entrar ou criar conta">
        <button type="button" data-mode="login" aria-pressed="true">Entrar</button>
        <button type="button" data-mode="register" aria-pressed="false">Criar conta</button>
      </div>

      <form id="auth-form" class="auth-form" novalidate>
        <label class="auth-field" id="name-field" hidden>
          <span>Nome</span>
          <input type="text" name="name" autocomplete="name" maxlength="80">
        </label>

        <label class="auth-field">
          <span>E-mail</span>
          <input type="email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required>
        </label>

        <label class="auth-field">
          <span>Senha</span>
          <span class="password-row">
            <input type="password" name="password" autocomplete="current-password" minlength="8" maxlength="128" required>
            <button type="button" class="btn btn-small" id="password-toggle" aria-pressed="false">Mostrar</button>
          </span>
          <small class="auth-hint" id="password-hint" hidden>Pelo menos 8 caracteres.</small>
        </label>

        <p class="form-error" id="form-error" role="alert" hidden></p>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Entrar</button>
      </form>
    </div>
  </main>
</body>
</html>
